name: Convert README to HTML

on:
  push:
    branches:
      - main  # 你也可以换成 'master' 或其他分支名

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Markdown converter
      run: pip install markdown

    - name: Convert README.md to index.html
      run: |
        python -c "
import markdown
with open('README.md', 'r', encoding='utf-8') as f:
    text = f.read()
html = markdown.markdown(text)
with open('index.html', 'w', encoding='utf-8') as f:
    f.write('<!DOCTYPE html><html><head><meta charset=\"UTF-8\"></head><body>' + html + '</body></html>')
        "

    - name: Commit and push index.html
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add index.html
        git commit -m 'Auto-generate index.html from README.md' || echo "No changes to commit"
        git push
